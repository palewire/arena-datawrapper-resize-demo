name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
      - palewire-resize-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the resize listener syntax
        run: node --check assets/resize-demo.js
      - name: Test listener behavior
        run: node --test tests/resize-demo.test.mjs
      - name: Check required static files
        run: test -f index.html && test -f assets/styles.css && test -f README.md

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
